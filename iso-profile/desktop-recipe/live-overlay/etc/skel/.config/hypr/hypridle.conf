# -*- Conf -*-
# Idle Daemon — Lock After 10 Min, DPMS After 15, Suspend After 30

listener {
    timeout = 600
    on-timeout = hyprlock
}

listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend 2>/dev/null || loginctl suspend
}