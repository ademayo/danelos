# -*- conf -*-
# Lock Screen — hyprlock

general {
    grace = 0
    hide_cursor = true
}

background {
    monitor =
    path = /usr/share/backgrounds/moraine-lake.jpg
    blur_passes = 2
    blur_size = 8
    noise = 0.02
}

input-field {
    monitor =
    size = 280, 44
    outline_thickness = 2
    placeholder_text = <i>password…</i>
    dots_spacing = 0.3
    font_family = Adwaita Sans
    font_size = 13
}

label {
    monitor =
    text = $TIME
    font_size = 46
    font_family = Adwaita Sans
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, $USER
    font_size = 16
    font_family = Adwaita Sans
    position = 0, 60
    halign = center
    valign = center
}