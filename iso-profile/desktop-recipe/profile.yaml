---
# Desktop Recipe ISO Profile — dinit Flavour (Built with `buildiso -I dinit`)

live-session:
  user: "artix"
  password: "artix"
  autologin: false
  use-xlibre: false
  services:
    - NetworkManager
    - syslog-ng
  user-services:
    - dbus

rootfs:
  packages:
    # Compositor Stack
    - hyprland
    - hyprland-guiutils
    - hyprland-qt-support
    - hypridle
    - hyprlock
    - hyprpaper
    - hyprshot
    - hyprpolkitagent
    - xdg-desktop-portal
    - xdg-desktop-portal-hyprland
    - xdg-desktop-portal-gtk
    - xorg-xwayland

    # Bar, Launcher, Logout
    - waybar
    - rofi
    - wlogout

    # Terminal, File Manager, Utilities (XFCE/MATE Ecosystem, No GNOME Apps)
    - alacritty
    - thunar
    - thunar-archive-plugin
    - gvfs
    - xarchiver
    - pavucontrol-qt
    - brightnessctl
    - grim
    - slurp
    - wl-clipboard
    - cliphist
    - mpv

    # Session Plumbing (pipewire-jack: Concrete jack Provider, Pacman Never Asks)
    - pipewire-jack

    # Everyday Desktop: Calculator, Image Viewer, PDF Viewer, Thumbnails
    - galculator
    - ristretto
    - qpdfview
    - tumbler

    # Login Manager (SDDM; dinit Service Added Below)
    - sddm
    - weston

    # Theme
    - arc-gtk-theme
    - gnome-themes-extra
    - papirus-icon-theme
    - adwaita-icon-theme
    - adwaita-icon-theme-legacy
    - adwaita-fonts
    - ttf-cascadia-code-nerd
    - noto-fonts
    - noto-fonts-emoji

    # Qt Theming under Wayland
    - qt5-wayland
    - qt6-wayland
    - qt6ct
    # Browsers
    - librewolf

    # Base Extras the Desktop Expects
    - elogind
    - userspawn

  packages-init:
    dinit:
      - networkmanager-dinit
      - syslog-ng-dinit
      - elogind-dinit
      - dbus-dinit
      - sddm-dinit
      - userspawn-dinit

livefs:
  packages:
    - mkinitcpio-nfs-utils
    - squashfs-tools
    - artix-grub-live
    - broadcom-wl