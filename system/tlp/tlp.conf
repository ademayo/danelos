# TLP — ThinkPad Laptop defaults.
# USB devices stay powered on battery so external keyboards/mice/drives do not drop.

# Do not enable autosuspend for any USB device on battery or AC.
USB_AUTOSUSPEND=0
USB_EXCLUDE_PHONE=0
USB_EXCLUDE_PRINTER=1

# Battery care for Laptop (dual internal + external if present).
# Stop charge at 80% to preserve cell health; start at 75%.
START_CHARGE_THRESH_BAT0=75
STOP_CHARGE_THRESH_BAT0=80
START_CHARGE_THRESH_BAT1=75
STOP_CHARGE_THRESH_BAT1=80

# Platform profile preference.
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced

# CPU scaling governor.
CPU_SCALING_GOVERNOR_ON_AC=performance
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Suspend/hybrid sleep: prefer deep sleep (S3) if firmware supports it well.
# The Laptop with modern BIOS/UEFI usually works with s2idle; use SLEEP_DEFAULT
# to let the kernel default (set via kernel cmdline or firmware) apply.
SLEEP_DEFAULT=s2idle

# Runtime PM for PCI devices except USB controllers.
RUNTIME_PM_ON_BAT=auto
RUNTIME_PM_ON_AC=on
RUNTIME_PM_DRIVER_DENYLIST=""

# Wi-Fi power saving on battery only.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Disable Bluetooth on boot if desired; keep enabled for the applet.
DEVICES_TO_DISABLE_ON_STARTUP=""

# NMI watchdog disabled on battery.
NMI_WATCHDOG=0
