# greetd Configuration
# tuigreet Runs On The Linux Console (KMS), No X Server, No Nested Compositor.
# Wayland Sessions Come From /usr/share/wayland-sessions (The hyprland Package).

[terminal]
# Run The Greeter On VT 1.
vt = 1

[default_session]
# Arc Dark Console Theme:
#   Border/Text/Prompt/Input Mapped To The Arc Dark Palette
#   (Dark Container, Steel-Blue Accent #5294e2, Dim Grey Text).
command = "tuigreet --time --asterisks --user-menu --remember --remember-session --window-padding 2 --container-padding 4 --prompt-padding 1 --theme 'border=#5294e2;text=#b8bfca;time=#5294e2;container=#2b2e34;title=#5294e2;greet=#d3dae3;prompt=#5294e2;input=#d3dae3;action=#7c8794;button=#5294e2' --cmd Hyprland"

# The Greeter User; Session Auth Happens Through PAM, Not This User.
user = "greeter"