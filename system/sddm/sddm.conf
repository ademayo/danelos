# danelos SDDM Overrides
# Wayland Greeter On Weston's Kiosk Shell (No X Server In The Boot Path).
# The Hyprland Session Itself Launches Per-User After Login; The Greeter
# Only Paints The Login Card. Session Entries Come From
# /usr/share/wayland-sessions (The Hyprland Package).

[General]
DisplayServer=wayland
GreeterEnvironment=QML2_IMPORT_PATH=/usr/lib/qt6/qml,QML_IMPORT_PATH=/usr/lib/qt6/qml

# Greeter Runs Inside Weston Kiosk Until A User Session Starts
CompositorCommand=weston --shell=kiosk

[Theme]
Current=arc-dark

[Wayland]
EnableHiDPI=true