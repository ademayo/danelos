# -*- toml -*-
# Alacritty — Arc Dark, Caskaydia Cove

[general]
import = []

[env]
TERM = "xterm-256color"

[window]
padding = { x = 6, y = 6 }
opacity = 0.96
decorations = "Full"

[font]
normal = { family = "CaskaydiaCove Nerd Font", style = "Regular" }
bold = { family = "CaskaydiaCove Nerd Font", style = "Bold" }
italic = { family = "CaskaydiaCove Nerd Font", style = "Italic" }
bold_italic = { family = "CaskaydiaCove Nerd Font", style = "Bold Italic" }
size = 11

# Arc Dark Palette
[colors.primary]
background = "#2f343f"
foreground = "#d3dae3"

[colors.cursor]
text = "#2f343f"
cursor = "#d3dae3"

[colors.normal]
black = "#33363d"
red = "#f8606a"
green = "#96d988"
yellow = "#f3d469"
blue = "#86a2be"
magenta = "#d0afca"
cyan = "#8bc7c6"
white = "#d3dae3"

[colors.bright]
black = "#5c616c"
red = "#f8606a"
green = "#96d988"
yellow = "#f3d469"
blue = "#86a2be"
magenta = "#d0afca"
cyan = "#8bc7c6"
white = "#d3dae3"

[selection]
background = "#4a4e59"
text = "#ffffff"

[keyboard]
bindings = [
  { key = "Paste", action = "Paste" },
  { key = "Copy", action = "Copy" },
]