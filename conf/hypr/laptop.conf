# -*- Conf -*-
# ThinkPad T490 Laptop Tweaks

# Input: touchpad + TrackPoint
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = false
        disable_while_typing = true
        middle_button_emulation = true
        tap-to-click = true
        drag_lock = false
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

# Disable touchpad while typing is handled by libinput above;
# this is the T490 default layout.

# Media / function keys that need explicit binds.
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ThinkPad special keys.
bind = , XF86Display, exec, hyprctl dispatch togglesplit   # Project / display key (F7)
bind = , XF86WLAN, exec, nmcli radio wifi toggle           # F8 airplane/wifi
bind = , XF86Tools, exec, $terminal                         # F9 settings/search
bind = , XF86Bluetooth, exec, blueman-manager               # F10 bluetooth

# Keyboard backlight cycling on Fn+Space isn't exposed as a keycode;
# it toggles in firmware. No bind needed.
