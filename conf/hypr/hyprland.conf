# -*- Conf -*-
# Hyprland Main Config

# Monitors Live In monitors.conf So Users Edit One File
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/autostart.conf

# Environment
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = MOZ_ENABLE_WAYLAND,1
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORM,wayland
env = GDK_BACKEND,wayland,x11
env = XCURSOR_THEME,default
env = XCURSOR_SIZE,24

# XDG Portal / Autostart Support
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP 2>/dev/null || true

# --- Look: Arc Dark ---------------------------------------------------------
exec-once = hyprpaper

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.94

    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        vibrancy = 0.17
    }

    drop_shadow = true
    shadow_range = 20
    shadow_render_power = 2
    col.shadow = rgba(1a1c20aa)
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(5294e2ee) rgba(7cb2f0aa) 40deg
    col.inactive_border = rgba(3b4152aa)
    layout = dwindle
    resize_on_border = true
    hover_icon_on_border = true
}

dwindle {
    pseudotile = true
    preserve_split = true
    smart_split = false
}

animations {
    enabled = true
    bezier = smooth, 0.25, 0.9, 0.25, 1.0
    bezier = overshot, 0.13, 0.99, 0.29, 1.1
    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 4, smooth, popin 80%
    animation = fade, 1, 3, smooth
    animation = workspaces, 1, 4, smooth, slide
    animation = border, 1, 5, smooth
    animation = borderangle, 0
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    disable_hyprland_qt_check = true
    vfr = true
    animate_manual_resizes = false
    new_window_takes_over_fullscreen = 2
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

gestures {
    workspace_swipe = true
}

# --- Keybindings (Sensible, XFCE-Desktop-Like) ------------------------------
$terminal = alacritty
$menu = rofi -show drun -show-icons

# Terminal: Ctrl+Alt+T (Classic Linux Desktop) And Super+Return
bind = CTRL ALT, T, exec, $terminal
bind = SUPER, Return, exec, $terminal

# Launcher: Ctrl+Space, Plus Alt+Space / Super+D Habits
bind = CTRL, Space, exec, $menu
bind = ALT, Space, exec, $menu
bind = SUPER, D, exec, $menu

# Keybind Cheatsheet: Super+/ Shows Every Live Binding in rofi
bind = SUPER, slash, exec, keybind-cheatsheet

# Browser
bind = SUPER SHIFT, B, exec, librewolf
bind = SUPER, B, exec, ungoogled-chromium || chromium

# File Manager
bind = SUPER SHIFT, E, exec, thunar

# Screenshots: Full + Region
bind = , Print, exec, hyprshot -m output
bind = SHIFT, Print, exec, hyprshot -m region
bind = SUPER SHIFT, S, exec, hyprshot -m region

# Screen Lock
bind = SUPER, L, exec, hyprlock

# Power Menu
bind = SUPER SHIFT, L, exec, wlogout

# Window Management
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen
bind = SUPER SHIFT, F, togglefloating
bind = SUPER, P, pseudo

# Clipboard Manager Picker
bind = SUPER, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# Focus
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d
bind = SUPER, H, movefocus, l

# Workspaces 1-9
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Volume / Brightness (XF86 Keys)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindle = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media
bindl = , XF86AudioStop, exec, playerctl stop

# Exit Hyprland (Via wlogout To Avoid Accidental Exits)
bind = SUPER SHIFT, Escape, exec, wlogout