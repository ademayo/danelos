name: Build ISO

on:
  workflow_dispatch:

  # Every Push to Master Rebuilds the ISO Unconditionally.
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "readme.md"
      - "**.md"
      - ".github/workflows/deploy-pages.yml"

  # On Schedule: Only when Artix Publishes a New base-dinit Release.
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect Newest Artix Release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          version="$(.github/workflows/scripts/latest-artix-iso-version.sh)"
          if [ -z "$version" ]; then
            echo "Could not fetch the Artix ISO index; skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Newest Artix ISO: $version"
          echo "Trigger: ${{ github.event_name }}"

          # Push Events Rebuild Unconditionally: the Tag Gets Overwritten So
          # The Release Always Tracks the Newest Recipe + Newest Artix base.
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "Push event — building unconditionally."
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif gh release view "artix-$version" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release artix-$version exists; nothing to do."
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New Artix release with no matching build."
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build-iso:
    needs: check-release
    if: needs.check-release.outputs.changed == 'true'
    runs-on: ubuntu-latest
    container:
      image: artixlinux/artixlinux:base-dinit
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Pin Fast Artix Mirrors
        # The Baked-In Mirrorlist Leads With mirrors.dotsrc.org (Throttles
        # GitHub Runners Below 1 B/s, Tripping pacman's 10-Second Stall
        # Failsafe) And ftp.ntua.gr (Stale — 404s On Current Packages).
        # Those Are The First Two Entries, So One Slow Day Fails The Whole
        # Transaction. Overwrite With Fast, Verified Mirrors; basestrap
        # Copies /etc/pacman.d/mirrorlist Into Every buildiso Chroot, So
        # The Chroot Syncs Are Covered Too.
        run: |
          printf '%s\n' \
            'Server = https://mirror1.artixlinux.org/repos/$repo/os/$arch' \
            'Server = https://mirror3.artixlinux.org/repos/$repo/os/$arch' \
            'Server = https://artix.wheaton.edu/repos/$repo/os/$arch' \
            'Server = https://ftp.halifax.rwth-aachen.de/artixlinux/$repo/os/$arch' \
            'Server = https://ftp.sh.cvut.cz/artix-linux/$repo/os/$arch' \
            'Server = https://mirror.netcologne.de/artix-linux/$repo/os/$arch' \
            > /etc/pacman.d/mirrorlist

      - name: Prepare Build Environment
        run: |
          pacman -Sy --noconfirm --needed artools-base artools-iso git rsync \
            squashfs-tools grub xorriso libisoburn dosfstools mtools go-yq
          # Artools' common.yaml packages-base Lists `vi`, which Is Now Only A
          # Virtual Provided by Two Packages (ex-vi-compat in World,
          # ex-evi-compat in Galaxy). Pacman's Provider Selection Reads Stdin
          # And Hangs the Container Job on the Open CI Pipe. Pick a Concrete
          # Provider Instead; ex-vi-compat Depends on vim, so the Live ISO
          # Keeps Both.
          common_yaml=/usr/share/artools/iso-profiles/common/common.yaml
          sed -i 's/^  - vi$/  - ex-vi-compat/' "$common_yaml"
          if grep -qE '^  - vi$' "$common_yaml"; then
            echo "Upstream common.yaml no longer matches the vi patch" >&2
            exit 1
          fi

      - name: Bake The Installer Into The Live Overlay
        run: |
          # buildiso Reads Profiles from ${WORKSPACE_DIR}/iso-profiles; The
          # Workspace Overlays the Packaged /usr/share/artools/iso-profiles.
          # The Whole Repo Goes into live-overlay, so the Installed System's
          # /root Gets the Installer plus Its Packages/, conf/, And
          # Wallpapers/ next to It.
          # .Gitignore Excludes live-overlay/root/, so a Fresh Checkout Has
          # No root/ Dir - rsync Only Creates the Final Destination
          # Component, Not Missing Parents, so Create It Explicitly.
          mkdir -p iso-profile/desktop-recipe/live-overlay/root
          rsync -a --exclude iso-profile . iso-profile/desktop-recipe/live-overlay/root/desktop-recipe/
          # live-overlay/usr/local/bin/recipe Is a Committed Wrapper Script
          # (Not a Symlink: make_livefs() cp Dereferences Symlinks While
          # Copying the Profile, and the Absolute /root Target Only Exists
          # Inside the Squashfs, Which Aborted the Build).
          mkdir -p ~/artools-workspace/iso-profiles
          rsync -a iso-profile/desktop-recipe ~/artools-workspace/iso-profiles/

      - name: Build The ISO (dinit)
        env:
          BUILD_VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          # No -v: This buildiso Does Not Accept It (Prints Usage, Exits 0,
          # Builds Nothing) and the Failed Build Still Returned Success,
          # Leaving ISO-Out Empty
          #
          # The Container root Is an Overlayfs, and mount(8) Refuses Overlay
          # Upperdirs on Top of Overlayfs ("Not Supported as Upperdir"),
          # which Make_livefs and Make_grub Need. Chroots Therefore Live On
          # A Tmpfs (-R), and /Dev/loop* Nodes beyond 0/1 Are Created For
          # The Efiboot.img Loop mount.
          mount --mkdir -t tmpfs tmpfs /mnt/artools-tmp
          for i in $(seq 0 15); do [ -e "/dev/loop$i" ] || mknod "/dev/loop$i" b 7 "$i"; done
          set -o pipefail
          buildiso -p desktop-recipe -i dinit -R stable \
            -r /mnt/artools-tmp/buildiso -t "$PWD/iso-out" 2>&1 | tee /tmp/buildiso.log

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildiso-log
          path: /tmp/buildiso.log
          if-no-files-found: ignore
          retention-days: 7


      - name: Collect Artifacts And Checksums
        run: |
          mkdir -p dist
          find iso-out -name '*.iso' -exec mv {} dist/ \;
          cd dist
          sha256sum *.iso > sha256sums.txt
          b2sum *.iso > b2sums.txt
          ls -lh
          echo "--- sha256 ---"
          cat sha256sums.txt

      - name: Read Checksums For Release Body
        run: |
          {
            echo "### Checksums"
            echo
            echo '```'
            cat dist/sha256sums.txt
            cat dist/b2sums.txt
            echo '```'
          } >> dist/release-notes.md

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-recipe-dinit-${{ needs.check-release.outputs.version }}
          path: |
            dist/*.iso
            dist/sha256sums.txt
            dist/b2sums.txt
          retention-days: 14
          if-no-files-found: error

  release:
    needs: [check-release, build-iso]
    if: needs.check-release.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download Built ISO
        uses: actions/download-artifact@v4
        with:
          name: desktop-recipe-dinit-${{ needs.check-release.outputs.version }}
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: artix-${{ needs.check-release.outputs.version }}
          name: Artix ${{ needs.check-release.outputs.version }}
          body_path: dist/release-notes.md
          # Push Builds Re-Tag and Re-Upload: Assets Are Replaced, Keeping
          # The Release Always Current for Its Artix base Version
          make_latest: true
          overwrite_files: true
          files: |
            dist/*.iso
            dist/sha256sums.txt
            dist/b2sums.txt
          fail_on_unmatched_files: true