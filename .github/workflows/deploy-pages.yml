name: Deploy Pages

on:
  workflow_dispatch:

  push:
    branches: [master]
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Site Must Be Enabled once in Repo Settings > Pages with Source:
      # "GitHub Actions" (GITHUB_TOKEN Cannot Create Pages Sites:
      # actions/configure-pages#40). configure-pages only reads metadata.
      - name: Setup Pages
        id: pages-setup
        uses: actions/configure-pages@v5

      - name: Collect site content
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          # Readme Travels with the Site for Completeness
          cp readme.md _site/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4